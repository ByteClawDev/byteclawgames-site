<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteClaw Games</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <div class="brand-container">
            <a href="./" class="brand-link">
                <img src="images/ByteClawGamesLogo_NoText_256.png" alt="ByteClaw Games Logo" class="header-logo">
                <span class="brand-text">ByteClaw Games</span>
            </a>
        </div>
        
        <nav class="center-nav">
            <a href="haunted-loop/" class="glitch-link">The Haunted Loop</a>
            <a href="about/" class="glitch-link">About The Studio</a>
        </nav>
        
        <div class="header-spacer"></div>
    </header>

    <main>
        <section class="hero-section">
            
            <div class="background-layer">
                <img src="images/ByteClawGamesLogo_NoText_2048.png" alt="" class="bg-ghost-logo">
                <h1 class="bg-tagline">Digitally Primal<sup>&trade;</sup></h1>
            </div>

            <div class="tint-layer"></div>

            <div class="foreground-layer">
                <span class="current-project-label">Current Project</span>
                
                <a href="haunted-loop/" class="game-logo-link">
                    <img src="images/library_logo_1280x720.png" alt="The Haunted Loop" class="game-hero-logo">
                </a>
                
                <a href="https://store.steampowered.com/app/4172940/The_Haunted_Loop/" target="_blank" class="steam-wishlist-btn">
                    Wishlist on Steam
                </a>
            </div>

        </section>
    </main>
	
	<footer class="main-footer">
        <div class="footer-content">
            <span class="footer-text">&copy; 2026 ByteClaw Games, LLC. All rights reserved.</span>
            
            <span class="footer-divider">|</span>
            
            <span class="footer-tagline">Digitally Primal&trade;</span>
            
            <span class="footer-divider">|</span>
            
            <button class="contact-reveal-btn" onclick="this.innerHTML='support@byteclawgames.com'; this.style.cursor='text'; this.style.color='#00ffff'; this.onclick=null;">
                Contact Us
            </button>
        </div>
    </footer>
</body>
</html>
